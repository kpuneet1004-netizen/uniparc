name: Validate Static Site
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/intro.js
      - name: Verify required site files and retained assets
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/assets/Uniparc.svg
          test -s site/assets/uniparc-hero.webp
          test -s site/assets/gorgon-001.webp
          test -s site/assets/hellboy-002.webp
          test -s site/assets/serious-003.webp
      - name: Ensure old framework files are gone
        run: |
          test ! -e src
          test ! -e public
          test ! -e package.json
          test ! -e vite.config.ts
          test ! -e tsconfig.json
